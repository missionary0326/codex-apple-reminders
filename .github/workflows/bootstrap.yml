name: Bootstrap repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore repository files
        env:
          REPOSITORY_ARCHIVE: 
        shell: bash
        run: |
          printf '%s' "$REPOSITORY_ARCHIVE" | base64 --decode > "$RUNNER_TEMP/repository.tar.gz"
          tar -xzf "$RUNNER_TEMP/repository.tar.gz" -C "$GITHUB_WORKSPACE"
          git config user.name "Jiawei Meng"
          git config user.email "103376411+missionary0326@users.noreply.github.com"
          git add .agents .gitignore LICENSE README.md plugins
          git rm .github/workflows/bootstrap.yml
          git commit -m "Initial public release of Apple Reminders plugin"
          git push
